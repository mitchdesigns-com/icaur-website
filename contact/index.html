<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact iCAUR — Get in touch with our team, find showrooms, or schedule a test drive.">
  <title>Contact Us — iCAUR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head>
<body class="is-loading">

<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <filter id="grain-filter" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    <feBlend in="SourceGraphic" in2="grey" mode="multiply"/>
  </filter>
</svg>

<div class="cursor" id="cursor" aria-hidden="true">
  <div class="cursor__dot" id="cursorDot"></div>
  <div class="cursor__ring" id="cursorRing"></div>
  <div class="cursor__label" id="cursorLabel"></div>
</div>
<div class="page-intro" id="pageIntro" aria-hidden="true"><span class="page-intro__logo">iCAUR</span></div>

<div id="site-header"></div>

<main id="main">

<!-- ═══════ CONTACT FORM ═══════ -->
<section class="rs-section" id="contact">
  <div class="rs-bg" aria-hidden="true"></div>
  <div class="rs-card reveal reveal--up">

    <!-- LEFT — headline + contact details -->
    <div class="rs-left">
      <p class="eyebrow rs-eyebrow">Get In Touch</p>
      <h2 class="rs-headline">Let's<br><em>Talk.</em></h2>
      <p class="rs-tagline">Whether you're ready to reserve, have questions, or just want to learn more — our team is here for you.</p>

    </div>

    <!-- RIGHT — chips + form -->
    <div class="rs-right">

      <!-- Chips -->
      <div class="contact-chips" role="tablist" aria-label="Request type" style="margin-bottom:24px">
        <button class="contact-chip is-active" role="tab" data-tab="test-drive" aria-selected="true" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>
          </svg>
          Test Drive
        </button>
        <button class="contact-chip" role="tab" data-tab="maintenance" aria-selected="false" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
          Maintenance
        </button>
        <button class="contact-chip" role="tab" data-tab="inquiry" aria-selected="false" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          Inquiry
        </button>
      </div>

      <!-- Form -->
      <form id="rsForm" aria-label="Contact form" novalidate>

        <!-- Common: name row -->
        <div class="rs-field-row">
          <div class="rs-field" id="rsf-first">
            <label class="rs-label" for="rs-first">First Name</label>
            <input class="rs-input" id="rs-first" type="text" required autocomplete="given-name">
          </div>
          <div class="rs-field" id="rsf-last">
            <label class="rs-label" for="rs-last">Last Name</label>
            <input class="rs-input" id="rs-last" type="text" required autocomplete="family-name">
          </div>
        </div>

        <!-- Common: email -->
        <div class="rs-field" id="rsf-email">
          <label class="rs-label" for="rs-email">Email Address</label>
          <input class="rs-input" id="rs-email" type="email" required autocomplete="email">
        </div>

        <!-- Common: phone -->
        <div class="rs-field" id="rsf-phone">
          <label class="rs-label" for="rs-phone">Phone Number</label>
          <input class="rs-input" id="rs-phone" type="tel" autocomplete="tel">
        </div>

        <!-- Panel: Test Drive -->
        <div class="contact-panel is-active rs-ctx" id="rp-test-drive" role="tabpanel">
          <div class="rs-select-wrap">
            <span class="rs-select-label">Preferred Model</span>
            <select class="rs-select" id="rs-td-model">
              <option value="" disabled selected></option>
              <option value="v27">V27 — Electric SUV</option>
              <option value="o3t">O3T — Electric Pickup</option>
            </select>
          </div>
        </div>

        <!-- Panel: Maintenance -->
        <div class="contact-panel rs-ctx" id="rp-maintenance" role="tabpanel">
          <div class="rs-ctx-row">
            <div class="rs-select-wrap">
              <span class="rs-select-label">Your Vehicle</span>
              <select class="rs-select" id="rs-mt-model">
                <option value="" disabled selected></option>
                <option value="v27">V27</option>
                <option value="o3t">O3T</option>
              </select>
            </div>
            <div class="rs-select-wrap">
              <span class="rs-select-label">Service Center</span>
              <select class="rs-select" id="rs-mt-city">
                <option value="" disabled selected></option>
                <option value="new-cairo">New Cairo — Qattamya</option>
                <option value="sheikh-zayed">Sheikh Zayed</option>
                <option value="maadi">Maadi, Cairo</option>
                <option value="6th-october">6th of October</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Panel: Inquiry -->
        <div class="contact-panel rs-ctx" id="rp-inquiry" role="tabpanel">
          <div class="rs-textarea-wrap">
            <span class="rs-textarea-label">Message</span>
            <textarea class="rs-textarea" id="rs-message" placeholder=""></textarea>
          </div>
        </div>

        <!-- CTA -->
        <div class="rs-cta">
          <button type="submit" class="rs-submit" id="rsSubmitBtn">REQUEST TEST DRIVE</button>
        </div>

      </form>

    </div>
  </div>
</section>

<script>
(function () {
  /* ── Chip switching ── */
  var chips   = document.querySelectorAll('.contact-chip');
  var panels  = document.querySelectorAll('.contact-panel');
  var submitBtn = document.getElementById('rsSubmitBtn');
  var labels  = { 'test-drive':'REQUEST TEST DRIVE', 'maintenance':'BOOK MAINTENANCE', 'inquiry':'SEND MESSAGE' };

  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      var tab = chip.dataset.tab;
      chips.forEach(function (c) {
        c.classList.toggle('is-active', c === chip);
        c.setAttribute('aria-selected', c === chip ? 'true' : 'false');
      });
      panels.forEach(function (p) {
        p.classList.toggle('is-active', p.id === 'rp-' + tab);
      });
      if (submitBtn) submitBtn.textContent = labels[tab] || 'SEND';
    });
  });

  /* ── Floating labels (text inputs) ── */
  document.querySelectorAll('.rs-field').forEach(function (wrap) {
    var input = wrap.querySelector('.rs-input');
    if (!input) return;
    function refresh() {
      wrap.classList.toggle('is-active', document.activeElement === input || input.value.length > 0);
    }
    input.addEventListener('focus', refresh);
    input.addEventListener('blur', refresh);
    input.addEventListener('input', refresh);
  });

  /* ── Floating labels (selects) ── */
  document.querySelectorAll('.rs-select-wrap').forEach(function (wrap) {
    var sel = wrap.querySelector('.rs-select');
    if (!sel) return;
    function refresh() {
      wrap.classList.toggle('is-active', sel.value !== '');
    }
    sel.addEventListener('change', refresh);
    refresh();
  });

  /* ── Floating labels (textarea) ── */
  document.querySelectorAll('.rs-textarea-wrap').forEach(function (wrap) {
    var ta = wrap.querySelector('.rs-textarea');
    if (!ta) return;
    function refresh() {
      wrap.classList.toggle('is-active', ta.value.length > 0);
    }
    ta.addEventListener('input', refresh);
    ta.addEventListener('focus', refresh);
    ta.addEventListener('blur', refresh);
  });

  /* ── Parallax background ── */
  var rsBg      = document.querySelector('.rs-bg');
  var rsSection = document.getElementById('contact');
  if (rsBg && rsSection) {
    function updateParallax() {
      var rect = rsSection.getBoundingClientRect();
      var progress = -rect.top;
      rsBg.style.transform = 'translateY(' + (progress * 0.3).toFixed(1) + 'px)';
    }
    window.addEventListener('scroll', function () { requestAnimationFrame(updateParallax); }, { passive: true });
    updateParallax();
  }

  /* ── Form submit ── */
  var rsForm = document.getElementById('rsForm');
  if (rsForm) {
    rsForm.addEventListener('submit', function (e) { e.preventDefault(); });
  }
})();
</script>

<!-- ═══════ FIND US — Interactive Map ═══════ -->
<section id="find-us" class="find-us">
  <div class="find-us__grid">
    <div class="find-us__left">
      <div class="find-us__header" id="findUsHeader">
        <p class="eyebrow eyebrow--warm">Find Us</p>
        <h2 class="find-us__h">Where To<br><em>Find Us</em></h2>
      </div>
      <div class="find-us__list" id="findUsList"></div>
    </div>
    <div class="find-us-map-wrap" id="findUsMapWrap">
      <div id="findUsMap"></div>
    </div>
  </div>
</section>


</main>

<div id="site-footer"></div>

  <script src="/js/components.js" defer></script>
  <script src="/js/main.js" defer></script>
  <script src="/js/game.js" defer></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/js/services.js" defer></script>
</body>
</html>
