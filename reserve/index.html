<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>if(sessionStorage.getItem('pt-nav'))document.documentElement.classList.add('pt-entering');</script>
  <link rel="icon" type="image/svg+xml" href="/assets/images/Favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reserve your iCAUR — Secure your V27 or V23 with a fully refundable deposit today.">
  <title>Reserve — iCAUR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://feedback-widget.mitchdesigns.workers.dev/widget.js"
    data-ingest-key="pk_45fe8548cf2370887b3de70a9d752080"
    data-endpoint="https://bugger-worker.mitchdesigns.workers.dev/functions/v1/ingest-feedback"
    data-position="bottom-right" data-button-text="Feedback" data-accent="#4f46e5" async></script>
</head>
<body class="is-loading dark-hero-page">

<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <filter id="grain-filter" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
    <feBlend in="SourceGraphic" in2="grey" mode="multiply"/>
  </filter>
</svg>

<div class="cursor" id="cursor" aria-hidden="true">
  <div class="cursor__dot" id="cursorDot"></div>
  <div class="cursor__ring" id="cursorRing"></div>
  <div class="cursor__label" id="cursorLabel"></div>
</div>


<div id="site-header"></div>

<main id="main">

<!-- ═══════ HERO + FLOATING FORM ═══════ -->
<section class="res-hero" id="reserve">
  <div class="res-hero__bg" aria-hidden="true"></div>

  <div class="res-hero__inner">
    <!-- Headline -->
    <p class="res-hero__eyebrow reveal reveal--up" data-delay="0">Your Next Drive Starts Here</p>
    <h1 class="res-hero__h reveal reveal--up" data-delay="1">Reserve Your iCAUR</h1>
    <p class="res-hero__sub reveal reveal--up" data-delay="2">Fill the form below and our team will help you take the next step toward owning the iCAUR.</p>

    <!-- Floating card -->
    <div class="res-card reveal reveal--up" data-delay="3">

      <!-- Model chooser -->
      <div class="res-card__section">
        <p class="res-section-title">Choose Model</p>
        <div class="res-model-row" role="radiogroup" aria-label="Select a model">

          <!-- V27 -->
          <div class="res-model-card is-active" data-model="v27" role="radio" aria-checked="true" tabindex="0">
            <div class="res-model-card__img">
              <img src="/assets/images/v27-model-in-homepge-01.png" alt="iCAUR V27 Electric SUV" loading="lazy">
            </div>
            <div class="res-model-card__body">
              <p class="res-model-card__name">V27</p>
              <div class="res-trims">
                <label class="res-trim"><input type="checkbox" name="v27-trim" value="classic"> Classic</label>
                <label class="res-trim"><input type="checkbox" name="v27-trim" value="premium" checked> Premium</label>
                <label class="res-trim"><input type="checkbox" name="v27-trim" value="flagship"> Flagship</label>
              </div>
            </div>
          </div>

          <!-- V23 -->
          <div class="res-model-card" data-model="v23" role="radio" aria-checked="false" tabindex="0">
            <div class="res-model-card__img">
              <img src="/assets/images/ot3-model-in-homepage-01.png" alt="iCAUR V23 Electric Sedan" loading="lazy">
            </div>
            <div class="res-model-card__body">
              <p class="res-model-card__name">OT3</p>
              <div class="res-trims">
                <label class="res-trim"><input type="checkbox" name="v23-trim" value="classic"> Classic</label>
                <label class="res-trim"><input type="checkbox" name="v23-trim" value="premium" checked> Premium</label>
                <label class="res-trim"><input type="checkbox" name="v23-trim" value="flagship"> Flagship</label>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Contact form -->
      <div class="res-card__section">
        <form id="resForm" aria-label="Reservation form" novalidate>

          <div class="rs-field-row">
            <div class="rs-field">
              <label class="rs-label" for="res-first">First Name</label>
              <input class="rs-input" id="res-first" type="text" placeholder="" required autocomplete="given-name">
            </div>
            <div class="rs-field">
              <label class="rs-label" for="res-last">Last Name</label>
              <input class="rs-input" id="res-last" type="text" placeholder="" required autocomplete="family-name">
            </div>
          </div>

          <div class="rs-field">
            <label class="rs-label" for="res-email">Email</label>
            <input class="rs-input" id="res-email" type="email" placeholder="" required autocomplete="email">
          </div>

          <div class="rs-field">
            <label class="rs-label" for="res-phone">Phone Number</label>
            <input class="rs-input" id="res-phone" type="tel" placeholder="" autocomplete="tel">
          </div>

          <div style="margin-top:28px">
            <button type="submit" class="res-submit">Submit Your Interest</button>
            <p class="res-terms-note">By submitting your interest you agree on iCAUR <a href="/terms">Terms &amp; Conditions</a></p>
          </div>

        </form>
      </div>

    </div><!-- /res-card -->
  </div><!-- /res-hero__inner -->
</section>


</main>

<div id="site-footer"></div>

<script>
// Model card selection
document.querySelectorAll('.res-model-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.res-model-card').forEach(c => {
      c.classList.remove('is-active');
      c.setAttribute('aria-checked', 'false');
    });
    card.classList.add('is-active');
    card.setAttribute('aria-checked', 'true');
  });
  card.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
  });
});

// Floating labels — inputs
document.querySelectorAll('.rs-field').forEach(function(field) {
  var inp = field.querySelector('.rs-input');
  if (!inp) return;
  function refresh() { field.classList.toggle('is-active', inp.value.length > 0 || document.activeElement === inp); }
  inp.addEventListener('input', refresh);
  inp.addEventListener('focus', refresh);
  inp.addEventListener('blur', refresh);
  refresh();
});

// Floating label — textarea
document.querySelectorAll('.rs-textarea-wrap').forEach(function(wrap) {
  var ta = wrap.querySelector('.rs-textarea');
  if (!ta) return;
  function refresh() { wrap.classList.toggle('is-active', ta.value.length > 0); }
  ta.addEventListener('input', refresh);
  ta.addEventListener('focus', refresh);
  ta.addEventListener('blur', refresh);
});

// Form submit
document.getElementById('resForm').addEventListener('submit', function(e) {
  e.preventDefault();
  this.innerHTML = '<div style="text-align:center;padding:40px 20px"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:16px"><polyline points="20 6 9 17 4 12"/></svg><h3 style="font-family:var(--f-display);font-size:1.6rem;font-weight:700;letter-spacing:-.025em;color:var(--black);margin:0 0 10px">Request Received</h3><p style="color:var(--text-mid);font-size:15px">Our team will be in touch with you shortly.</p></div>';
});
</script>

<script src="/js/components.js" defer></script>
<script src="/js/main.js" defer></script>
  <script src="/js/transitions.js" defer></script>
<script src="/js/game.js" defer></script>
</body>
</html>
